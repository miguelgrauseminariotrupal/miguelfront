  /matriculas:
    get:
      tags: [Matriculas]
      summary: Listar matrículas
      description: >
        Los filtros id_anio_lectivo/id_nivel/id_grado/id_seccion suben la
        cadena mg_programacion_seccion -> mg_seccion -> mg_grado -> mg_nivel;
        'q' busca por nombre/apellidos/dni del alumno matriculado. Todos se
        pueden combinar entre sí y con id_programacion_seccion/id_estudiante/estado.
      parameters:
        - name: id_programacion_seccion
          in: query
          schema: { type: integer }
        - name: id_estudiante
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/EstadoFilter'
        - name: id_seccion
          in: query
          schema: { type: integer }
        - name: id_grado
          in: query
          schema: { type: integer }
        - name: id_nivel
          in: query
          schema: { type: integer }
        - name: id_anio_lectivo
          in: query
          schema: { type: integer }
        - name: q
          in: query
          description: Búsqueda parcial (ILIKE) por nombres/apellidos/dni del alumno.
          schema: { type: string }
      responses:
        '200':
          description: Lista de matrículas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Matricula' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Matriculas]
      summary: Matricular a un estudiante en una sección
      description: >
        Campos obligatorios: `id_seccion` (debe tener ya una
        mg_programacion_seccion creada), `id_estudiante`. Opcionales:
        `fecha_matricula` (default fecha actual), `estado` (default true).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatriculaCreate' }
      responses:
        '201':
          description: Matrícula creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Matricula' }
        '400':
          description: >
            Validación de campos, o 'id_seccion' sin una programación de
            sección activa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409': { $ref: '#/components/responses/Conflict' }

  /matriculas/{id}:
    get:
      tags: [Matriculas]
      summary: Obtener matrícula por id
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Matrícula
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Matricula' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
