openapi: 3.0.3
info:
  title: Mannucci - API de Gestión Académica
  description: >
    API del módulo académico base (años lectivos, niveles, grados, secciones,
    cursos, usuarios, docentes, estudiantes, programación de secciones/cursos
    y matrícula), implementada como Supabase Edge Functions (Deno).


    **Autenticación:** ninguna todavía. Todas las funciones se despliegan con
    `verify_jwt = false`, por lo que no requieren un JWT de usuario en
    `Authorization`. Se recomienda igual enviar el header `apikey` (la
    anon/publishable key del proyecto) por convención de Supabase. Esto debe
    revisarse antes de exponer la API en producción.


    **Sin DELETE:** ningún módulo tiene endpoint `DELETE` por ahora. La
    mayoría de tablas tiene un campo `estado` booleano (`true` = activo, por
    defecto) que se desactiva manualmente mandando `estado: false` en el
    `PUT` correspondiente.


    **Formato de error:** toda respuesta de error usa el mismo cuerpo
    `{ "error": "mensaje" }`, con el código HTTP correspondiente (400, 404,
    409 o 500).
  version: "1.0.0"
  contact:
    name: Asociación Educativa Carlos A. Mannucci

servers:
  - url: https://fqidwaafiojvcamzmilu.supabase.co/functions/v1
    description: Proyecto Supabase (Mannucci)

security:
  - apiKeyAuth: []

tags:
  - name: AniosLectivos
    description: Años lectivos (mg_anio_lectivo)
  - name: Niveles
    description: Niveles educativos por año lectivo (mg_nivel)
  - name: Grados
    description: Grados por nivel (mg_grado)
  - name: Secciones
    description: Secciones por grado (mg_seccion)
  - name: Cursos
    description: Cursos por año lectivo (mg_curso)
  - name: Usuarios
    description: Cuentas de acceso (mg_usuario)
  - name: Docentes
    description: Docentes, opcionalmente enlazados a un usuario (mg_docente)
  - name: Estudiantes
    description: Estudiantes (mg_estudiante)
  - name: ProgramacionSecciones
    description: Programación anual de una sección (tutor responsable)
  - name: ProgramacionCursos
    description: Cursos programados dentro de una sección
  - name: Matriculas
    description: Matrícula de estudiantes en una sección

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: >
        anon/publishable key del proyecto Supabase. No se valida un JWT de
        usuario (verify_jwt=false en todas las funciones), pero se recomienda
        enviar igual este header.

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
      example:
        error: "Mensaje descriptivo del error"

    AnioLectivo:
      type: object
      properties:
        id_anio_lectivo: { type: integer, readOnly: true }
        anio: { type: integer, example: 2026 }
        nombre: { type: string, example: "Año Escolar 2026" }
        estado: { type: boolean, default: true }
      required: [id_anio_lectivo, anio, nombre, estado]

    AnioLectivoCreate:
      type: object
      properties:
        anio: { type: integer, example: 2026 }
        nombre: { type: string, example: "Año Escolar 2026" }
        estado: { type: boolean, default: true }
      required: [anio, nombre]

    AnioLectivoUpdate:
      type: object
      description: >
        Nota: a diferencia de la creación, esta actualización NO permite
        modificar 'nombre' por ahora (solo 'anio' y 'estado').
      properties:
        anio: { type: integer }
        estado: { type: boolean }

    Nivel:
      type: object
      properties:
        id_nivel: { type: integer, readOnly: true }
        id_anio_lectivo: { type: integer }
        nombre: { type: string, example: "Primaria" }
        estado: { type: boolean, default: true }
      required: [id_nivel, id_anio_lectivo, nombre, estado]

    NivelCreate:
      type: object
      properties:
        id_anio_lectivo: { type: integer }
        nombre: { type: string, example: "Primaria" }
        estado: { type: boolean, default: true }
      required: [id_anio_lectivo, nombre]

    NivelUpdate:
      type: object
      properties:
        id_anio_lectivo: { type: integer }
        nombre: { type: string }
        estado: { type: boolean }

    Grado:
      type: object
      properties:
        id_grado: { type: integer, readOnly: true }
        id_nivel: { type: integer }
        nombre: { type: string, example: "3er grado" }
        estado: { type: boolean, default: true }
      required: [id_grado, id_nivel, nombre, estado]

    GradoCreate:
      type: object
      properties:
        id_nivel: { type: integer }
        nombre: { type: string, example: "3er grado" }
        estado: { type: boolean, default: true }
      required: [id_nivel, nombre]

    GradoUpdate:
      type: object
      properties:
        id_nivel: { type: integer }
        nombre: { type: string }
        estado: { type: boolean }

    Seccion:
      type: object
      properties:
        id_seccion: { type: integer, readOnly: true }
        id_grado: { type: integer }
        nombre: { type: string, example: "A" }
        estado: { type: boolean, default: true }
      required: [id_seccion, id_grado, nombre, estado]

    SeccionCreate:
      type: object
      properties:
        id_grado: { type: integer }
        nombre: { type: string, example: "A" }
        estado: { type: boolean, default: true }
      required: [id_grado, nombre]

    SeccionUpdate:
      type: object
      properties:
        id_grado: { type: integer }
        nombre: { type: string }
        estado: { type: boolean }

    Curso:
      type: object
      properties:
        id_curso: { type: integer, readOnly: true }
        id_anio_lectivo: { type: integer }
        nombre: { type: string, example: "Matemática" }
        estado: { type: boolean, default: true }
      required: [id_curso, id_anio_lectivo, nombre, estado]

    CursoCreate:
      type: object
      properties:
        id_anio_lectivo: { type: integer }
        nombre: { type: string, example: "Matemática" }
        estado: { type: boolean, default: true }
      required: [id_anio_lectivo, nombre]

    CursoUpdate:
      type: object
      properties:
        id_anio_lectivo: { type: integer }
        nombre: { type: string }
        estado: { type: boolean }

    Usuario:
      type: object
      description: Nunca incluye password_hash.
      properties:
        id_usuario: { type: integer, readOnly: true }
        usuario: { type: string, example: "jperez" }
        correo: { type: string, format: email }
        estado: { type: boolean, default: true }
        fecha_creacion: { type: string, format: date-time, readOnly: true }
      required: [id_usuario, usuario, correo, estado, fecha_creacion]

    UsuarioCreate:
      type: object
      properties:
        usuario: { type: string, example: "jperez" }
        correo: { type: string, format: email }
        password: { type: string, format: password, minLength: 6 }
        estado: { type: boolean, default: true }
      required: [usuario, correo, password]

    UsuarioUpdate:
      type: object
      properties:
        usuario: { type: string }
        correo: { type: string, format: email }
        password: { type: string, format: password, minLength: 6 }
        estado: { type: boolean }

    Docente:
      type: object
      properties:
        id_docente: { type: integer, readOnly: true }
        id_usuario: { type: integer, nullable: true }
        nombres: { type: string, example: "Hugo" }
        apellido_paterno: { type: string, nullable: true, example: "Flores" }
        apellido_materno: { type: string, nullable: true, example: "Rodriguez" }
        dni: { type: string, nullable: true, example: "87654321" }
        telefono: { type: string, nullable: true }
        correo: { type: string, format: email, nullable: true }
        estado: { type: boolean, default: true }
      required: [id_docente, nombres, estado]

    DocenteCreate:
      type: object
      description: >
        Si `indUsuario` es true: 'correo' y 'dni' (8 dígitos) pasan a ser
        requeridos. Se crea automáticamente un mg_usuario enlazado, con
        `usuario` = el mismo correo y contraseña = el dni (hasheada). La
        respuesta en ese caso es distinta (ver DocenteConUsuarioResponse).
      properties:
        id_usuario:
          type: integer
          nullable: true
          description: Solo aplica cuando indUsuario no es true.
        nombres: { type: string, example: "Hugo" }
        apellido_paterno: { type: string, example: "Flores" }
        apellido_materno: { type: string, example: "Rodriguez" }
        dni:
          type: string
          example: "87654321"
          description: Requerido (8 dígitos) si indUsuario=true.
        telefono: { type: string }
        correo:
          type: string
          format: email
          description: Requerido si indUsuario=true.
        estado: { type: boolean, default: true }
        indUsuario:
          type: boolean
          default: false
          description: Si es true, crea también el mg_usuario enlazado.
      required: [nombres]

    DocenteUpdate:
      type: object
      properties:
        id_usuario: { type: integer, nullable: true }
        nombres: { type: string }
        apellido_paterno: { type: string, nullable: true }
        apellido_materno: { type: string, nullable: true }
        dni: { type: string, nullable: true }
        telefono: { type: string, nullable: true }
        correo: { type: string, format: email, nullable: true }
        estado: { type: boolean }

    DocenteConUsuarioResponse:
      type: object
      description: Respuesta de POST /docentes cuando el body trae indUsuario=true.
      properties:
        usuario:
          $ref: '#/components/schemas/Usuario'
        docente:
          $ref: '#/components/schemas/Docente'
      required: [usuario, docente]

    Estudiante:
      type: object
      properties:
        id_estudiante: { type: integer, readOnly: true }
        nombres: { type: string, example: "Ana" }
        apellido_paterno: { type: string, nullable: true, example: "Torres" }
        apellido_materno: { type: string, nullable: true, example: "Diaz" }
        dni: { type: string, nullable: true, example: "71234567" }
        fecha_nacimiento: { type: string, format: date, nullable: true }
        estado: { type: boolean, default: true }
      required: [id_estudiante, nombres, estado]

    EstudianteCreate:
      type: object
      properties:
        nombres: { type: string, example: "Ana" }
        apellido_paterno: { type: string, example: "Torres" }
        apellido_materno: { type: string, example: "Diaz" }
        dni: { type: string, example: "71234567" }
        fecha_nacimiento: { type: string, format: date, example: "2015-04-12" }
        estado: { type: boolean, default: true }
      required: [nombres]

    EstudianteUpdate:
      type: object
      properties:
        nombres: { type: string }
        apellido_paterno: { type: string, nullable: true }
        apellido_materno: { type: string, nullable: true }
        dni: { type: string, nullable: true }
        fecha_nacimiento: { type: string, format: date, nullable: true }
        estado: { type: boolean }

    ProgramacionSeccion:
      type: object
      properties:
        id_programacion_seccion: { type: integer, readOnly: true }
        id_seccion: { type: integer }
        id_docente_responsable: { type: integer }
        estado_completado:
          type: boolean
          default: false
          description: >
            true si ya se terminó de configurar la programación de la
            sección. Por defecto false.
      required: [id_programacion_seccion, id_seccion, id_docente_responsable, estado_completado]

    ProgramacionSeccionCreate:
      type: object
      properties:
        id_seccion: { type: integer }
        id_docente_responsable: { type: integer }
        estado_completado: { type: boolean, default: false }
      required: [id_seccion, id_docente_responsable]

    ProgramacionSeccionUpdate:
      type: object
      properties:
        id_seccion: { type: integer }
        id_docente_responsable: { type: integer }
        estado_completado: { type: boolean }

    ProgramacionCurso:
      type: object
      properties:
        id_programacion_curso: { type: integer, readOnly: true }
        id_programacion_seccion: { type: integer }
        id_curso: { type: integer }
        id_docente: { type: integer }
        estado: { type: boolean, default: true }
      required: [id_programacion_curso, id_programacion_seccion, id_curso, id_docente, estado]

    ProgramacionCursoCreate:
      type: object
      properties:
        id_programacion_seccion: { type: integer }
        id_curso: { type: integer }
        id_docente: { type: integer }
        estado: { type: boolean, default: true }
      required: [id_programacion_seccion, id_curso, id_docente]

    ProgramacionCursoUpdate:
      type: object
      properties:
        id_programacion_seccion: { type: integer }
        id_curso: { type: integer }
        id_docente: { type: integer }
        estado: { type: boolean }

    Matricula:
      type: object
      properties:
        id_matricula: { type: integer, readOnly: true }
        id_programacion_seccion: { type: integer, readOnly: true }
        id_estudiante: { type: integer }
        fecha_matricula: { type: string, format: date }
        estado: { type: boolean, default: true }
      required: [id_matricula, id_programacion_seccion, id_estudiante, fecha_matricula, estado]

    MatriculaCreate:
      type: object
      description: >
        Recibe 'id_seccion' (no 'id_programacion_seccion'): el servidor
        resuelve internamente la programación de sección activa para esa
        sección y guarda su id_programacion_seccion real.
      properties:
        id_seccion:
          type: integer
          description: Debe tener una mg_programacion_seccion ya creada.
        id_estudiante: { type: integer }
        fecha_matricula:
          type: string
          format: date
          description: Si se omite, la BD usa la fecha actual.
        estado: { type: boolean, default: true }
      required: [id_seccion, id_estudiante]

    MatriculaUpdate:
      type: object
      properties:
        id_seccion:
          type: integer
          description: Igual que en creación, se resuelve a id_programacion_seccion.
        id_estudiante: { type: integer }
        fecha_matricula: { type: string, format: date, nullable: true }
        estado: { type: boolean }

  parameters:
    EstadoFilter:
      name: estado
      in: query
      description: Filtra por activo (true) o inactivo (false).
      schema: { type: boolean }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }

  responses:
    BadRequest:
      description: Solicitud inválida (validación de campos)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Conflicto por restricción UNIQUE (duplicado)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServerError:
      description: Error interno / de base de datos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

paths:
  /anios-lectivos:
    get:
      tags: [AniosLectivos]
      summary: Listar años lectivos
      parameters:
        - $ref: '#/components/parameters/EstadoFilter'
      responses:
        '200':
          description: Lista de años lectivos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AnioLectivo' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [AniosLectivos]
      summary: Crear año lectivo
      description: "Campos obligatorios: `anio`, `nombre`. Opcional: `estado` (default true)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnioLectivoCreate' }
      responses:
        '201':
          description: Año lectivo creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnioLectivo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /anios-lectivos/{id}:
    get:
      tags: [AniosLectivos]
      summary: Obtener año lectivo por id
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Año lectivo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnioLectivo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [AniosLectivos]
      summary: Actualizar año lectivo (no permite cambiar 'nombre' por ahora)
      description: "Todos los campos son opcionales, pero debe enviarse al menos uno (`anio` o `estado`)."
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnioLectivoUpdate' }
      responses:
        '200':
          description: Año lectivo actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnioLectivo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /niveles:
    get:
      tags: [Niveles]
      summary: Listar niveles
      parameters:
        - name: id_anio_lectivo
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/EstadoFilter'
      responses:
        '200':
          description: Lista de niveles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Nivel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Niveles]
      summary: Crear nivel
      description: "Campos obligatorios: `id_anio_lectivo`, `nombre`. Opcional: `estado` (default true)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NivelCreate' }
      responses:
        '201':
          description: Nivel creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Nivel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /niveles/{id}:
    get:
      tags: [Niveles]
      summary: Obtener nivel por id
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Nivel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Nivel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Niveles]
      summary: Actualizar nivel
      description: "Todos los campos son opcionales, pero debe enviarse al menos uno."
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NivelUpdate' }
      responses:
        '200':
          description: Nivel actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Nivel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /grados:
    get:
      tags: [Grados]
      summary: Listar grados
      parameters:
        - name: id_nivel
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/EstadoFilter'
      responses:
        '200':
          description: Lista de grados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Grado' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Grados]
      summary: Crear grado
      description: "Campos obligatorios: `id_nivel`, `nombre`. Opcional: `estado` (default true)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GradoCreate' }
      responses:
        '201':
          description: Grado creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Grado' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /grados/{id}:
    get:
      tags: [Grados]
      summary: Obtener grado por id
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Grado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Grado' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Grados]
      summary: Actualizar grado
      description: "Todos los campos son opcionales, pero debe enviarse al menos uno."
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GradoUpdate' }
      responses:
        '200':
          description: Grado actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Grado' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /secciones:
    get:
      tags: [Secciones]
      summary: Listar secciones
      parameters:
        - name: id_grado
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/EstadoFilter'
      responses:
        '200':
          description: Lista de secciones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Seccion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Secciones]
      summary: Crear sección
      description: "Campos obligatorios: `id_grado`, `nombre`. Opcional: `estado` (default true)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeccionCreate' }
      responses:
        '201':
          description: Sección creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Seccion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /secciones/{id}:
    get:
      tags: [Secciones]
      summary: Obtener sección por id
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Sección
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Seccion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Secciones]
      summary: Actualizar sección
      description: "Todos los campos son opcionales, pero debe enviarse al menos uno."
